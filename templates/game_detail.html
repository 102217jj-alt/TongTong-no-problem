<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-3" style="background:#f8f9fa">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>{{ title }}</h3>
            <a href="/games" class="btn btn-sm btn-outline-secondary">回遊戲清單</a>
        </div>

        <div class="card">
            <div class="card-body">
                <p>{{ description }}</p>
                <p class="text-muted">遊戲代號：{{ name }}</p>
            </div>
        </div>
    </div>
</body>

</html>
