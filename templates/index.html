<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>通通 (TongTong) 語音聊天</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --accent-color: #f9e79f;
            --bg-dark: #1a1a1a;
            --nav-bg: #222;
        }

        body { background-color: var(--bg-dark); color: white; font-family: 'Heiti TC', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background-color 0.5s; }
        
        /* Top Navigation Bar */
        #top-nav { background-color: var(--nav-bg); padding: 10px 15px; border-bottom: 1px solid #444; display: flex; align-items: center; justify-content: space-between; transition: background-color 0.5s; }
        .original-btn { background: var(--primary-color); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; transition: 0.3s; }
        .original-btn.active { box-shadow: 0 0 15px var(--primary-color); border: 1px solid #fff; }
        .personality-dropdown { background: #333; color: var(--accent-color); border: 1px solid #555; padding: 6px; border-radius: 8px; font-size: 14px; width: 140px; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .message { margin-bottom: 15px; max-width: 85%; padding: 10px 15px; border-radius: 20px; word-wrap: break-word; transition: 0.3s; }
        .user-message { background-color: var(--primary-color); align-self: flex-end; margin-left: auto; border-bottom-right-radius: 5px; }
        .bot-message { background-color: #333; align-self: flex-start; border-bottom-left-radius: 5px; color: var(--accent-color); }
        
        #controls-area { background-color: var(--nav-bg); border-top: 1px solid #444; padding: 10px; transition: background-color 0.5s; }
        #quick-actions { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; justify-content: center; }
        .action-btn { background: #444; color: var(--accent-color); border: 1px solid #666; padding: 8px 15px; border-radius: 20px; font-size: 14px; white-space: nowrap; transition: 0.3s; }
        .action-btn:hover { transform: scale(1.05); background: #555; }
        
        #input-area { background-color: #111; padding: 15px; display: flex; align-items: center; transition: background-color 0.5s; }
        .mic-btn { width: 50px; height: 50px; border-radius: 25px; border: none; background-color: #e74c3c; color: white; font-size: 20px; flex-shrink: 0; }
        .mic-btn.recording { background-color: #c0392b; box-shadow: 0 0 15px #e74c3c; animation: pulse 1.5s infinite; }
        
        #send-btn { background-color: var(--primary-color); border: none; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .voice-settings select { background:#333; color:white; border:none; width:60px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="top-nav">
        <button id="btn-original" class="original-btn active" onclick="switchToOriginal()">🤖 通通沒問題</button>
        
        <div class="d-flex align-items-center">
            <button id="stop-btn" class="btn btn-sm btn-outline-danger me-2" onclick="stopCurrentAudio()" title="停止播放">⏹️</button>
            <select id="mode-dropdown" class="personality-dropdown" onchange="switchToPersonality()">
                <option value="" disabled selected>✨ 性格模式...</option>
                <option value="好心情">😊 好心情</option>
                <option value="神算師">🔮 神算師</option>
                <option value="屬於我">👤 屬於我</option>
                <option value="去睡覺">😴 去睡覺</option>
                <option value="不知道">❓ 不知道</option>
            </select>
            <div class="voice-settings ms-2">
                <select id="voice-select" class="form-select form-select-sm">
                    <option value="female">👧女</option>
                    <option value="male">👦男</option>
                </select>
            </div>
        </div>
    </div>

    <div id="chat-container">
        <!-- Messages will be added dynamically here -->
    </div>

    <div id="controls-area">
        <div id="quick-actions">
            <!-- Dynamic buttons go here -->
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="text-input" class="form-control me-2" placeholder="輸入你想查詢的內容..." style="background:#222; color:white; border:1px solid #444;">
        <button id="send-btn" class="btn btn-primary btn-sm me-2">發送</button>
        <button id="mic-btn" class="mic-btn">🎤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const stopBtn = document.getElementById('stop-btn');
        const inputArea = document.getElementById('input-area');
        const voiceSelect = document.getElementById('voice-select');
        const quickActions = document.getElementById('quick-actions');
        const modeDropdown = document.getElementById('mode-dropdown');
        const btnOriginal = document.getElementById('btn-original');
        
        let currentMode = '通通沒問題';
        let currentAudio = null; 
        let isProcessing = false; 

        const THEMES = {
            '通通沒問題': { primary: '#007bff', accent: '#f9e79f', bg: '#1a1a1a', nav: '#222' },
            '好心情': { primary: '#f39c12', accent: '#fff', bg: '#2c2305', nav: '#3e2c07' },
            '神算師': { primary: '#9b59b6', accent: '#e0b0ff', bg: '#1c1426', nav: '#2d1b3d' },
            '屬於我': { primary: '#e91e63', accent: '#ffc1cc', bg: '#26141a', nav: '#3d1b26' },
            '去睡覺': { primary: '#34495e', accent: '#bdc3c7', bg: '#0f171e', nav: '#1a252f' },
            '不知道': { primary: '#1abc9c', accent: '#a3e4d7', bg: '#0b2621', nav: '#133d36' }
        };

        const MODE_ACTIONS = {
            '通通沒問題': ['你是誰？', '台北天氣', '現在時間', '推薦好吃的', '說個勵志名言', '查 台灣歷史'],
            '好心情': ['講個笑話', '陪我聊天'],
            '神算師': ['占卜運勢', '測幸運色'],
            '屬於我': ['深情告白', '修改稱呼'],
            '去睡覺': ['睡前故事', '數羊'],
            '不知道': ['考考我', '放棄']
        };

        let thinkingBubble = null;

        function applyTheme(mode) {
            const theme = THEMES[mode] || THEMES['通通沒問題'];
            const root = document.documentElement;
            root.style.setProperty('--primary-color', theme.primary);
            root.style.setProperty('--accent-color', theme.accent);
            root.style.setProperty('--bg-dark', theme.bg);
            root.style.setProperty('--nav-bg', theme.nav);
        }

        function setUILoading(loading) {
            isProcessing = loading;
            const elementsToDisable = [textInput, sendBtn, micBtn, modeDropdown, btnOriginal];
            
            elementsToDisable.forEach(el => {
                if (loading) {
                    el.classList.add('opacity-50');
                    el.style.pointerEvents = 'none';
                } else {
                    el.classList.remove('opacity-50');
                    el.style.pointerEvents = 'auto';
                }
            });

            if (loading) {
                textInput.placeholder = "通通正在思考中...";
                thinkingBubble = document.createElement('div');
                thinkingBubble.className = 'message bot-message';
                thinkingBubble.style.fontStyle = 'italic';
                thinkingBubble.innerHTML = '<span class="spinner-grow spinner-grow-sm me-2"></span>通通正在思考...';
                chatContainer.appendChild(thinkingBubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } else {
                if (thinkingBubble) {
                    thinkingBubble.remove();
                    thinkingBubble = null;
                }
                updateUIForMode(currentMode); 
            }
        }

        function stopCurrentAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
        }

        function updateUIForMode(mode) {
            applyTheme(mode);

            if (mode === '通通沒問題') {
                inputArea.style.display = "flex";
                textInput.disabled = false;
                textInput.placeholder = "輸入你想查詢的內容...";
                sendBtn.disabled = false;
                micBtn.disabled = false;
                micBtn.style.opacity = "1";
                btnOriginal.classList.add('active');
                modeDropdown.selectedIndex = 0; 
            } else {
                inputArea.style.display = "none";
                btnOriginal.classList.remove('active');
            }

            quickActions.innerHTML = '';
            const actions = MODE_ACTIONS[mode] || [];
            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerText = action;
                btn.onclick = () => { if(!isProcessing) sendMessage(action, true); };
                quickActions.appendChild(btn);
            });
        }

        function switchToOriginal() {
            if (isProcessing) return;
            window.location.href = "/?mode=" + encodeURIComponent("通通沒問題");
        }

        function switchToPersonality() {
            if (isProcessing) return;
            const selectedMode = modeDropdown.value;
            if (selectedMode) {
                window.location.href = "/?mode=" + encodeURIComponent(selectedMode);
            }
        }

        currentMode = "{{ current_mode }}" || '通通沒問題';
        updateUIForMode(currentMode);

        if (currentMode !== '通通沒問題') {
            modeDropdown.value = currentMode;
        }

        const preloadedMsg = "{{ initial_message }}";
        const preloadedAudio = "{{ initial_audio }}";

        if (preloadedMsg && preloadedMsg !== "None") {
            addMessage('bot', preloadedMsg);
            if (preloadedAudio && preloadedAudio !== "None") {
                currentAudio = new Audio(preloadedAudio);
                currentAudio.play().catch(e => console.log("Autoplay waiting for interaction"));
            }
        }

        let recognition;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'zh-TW';
            recognition.onstart = () => {
                stopCurrentAudio();
                micBtn.classList.add('recording');
            };
            recognition.onresult = (event) => sendMessage(event.results[0][0].transcript);
            recognition.onerror = () => micBtn.classList.remove('recording');
            recognition.onend = () => micBtn.classList.remove('recording');
        }

        micBtn.onclick = () => {
            if (isProcessing || currentMode !== '通通沒問題') return;
            if (micBtn.classList.contains('recording')) recognition.stop();
            else recognition.start();
        };

        sendBtn.onclick = () => {
            if (isProcessing) return;
            const text = textInput.value;
            if (text.trim()) { sendMessage(text); textInput.value = ''; }
        };

        textInput.onkeydown = (event) => {
            if (event.key === 'Enter' && !isProcessing) {
                sendBtn.click();
                event.preventDefault();
            }
        };

        async function sendMessage(text, isButtonClick = false) {
            if (isProcessing) return;
            if (!isButtonClick && currentMode !== '通通沒問題') return;
            
            stopCurrentAudio();
            if (text.trim()) addMessage('user', text);
            
            setUILoading(true);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        mode: currentMode,
                        voice_type: voiceSelect.value
                    })
                });
                
                const data = await response.json();
                if (data.reply) {
                    addMessage('bot', data.reply);
                    if (data.audio_url) {
                        currentAudio = new Audio(data.audio_url);
                        currentAudio.play();
                    }
                }
            } catch (error) {
                if (text.trim()) addMessage('bot', '連不上大腦囉...');
            } finally {
                setUILoading(false);
            }
        }

        function addMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        setInterval(() => fetch('/api/cleanup', {method: 'POST'}), 600000);
    </script>
</body>
</html>
