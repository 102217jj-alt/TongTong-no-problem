<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>遊戲專區</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background: #f8f9fa
        }

        .game-card {
            min-width: 200px
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>遊戲專區</h3>
            <a href="/" class="btn btn-sm btn-outline-secondary">回首頁</a>
        </div>

        <div class="row g-3">
            {% for g in games %}
            <div class="col-12 col-sm-6 col-md-4">
                <div class="card game-card">
                    <div class="card-body">
                        <h5 class="card-title">{{ g.title }}</h5>
                        <p class="card-text">遊戲代號：{{ g.name }}</p>
                        <a href="/games/{{ g.name }}" class="btn btn-primary">開始遊戲</a>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12">
                <div class="alert alert-info">目前沒有可用遊戲。</div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
