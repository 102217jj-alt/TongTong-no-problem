<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>五子棋</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(15, 28px);
            gap: 2px
        }

        .cell {
            width: 28px;
            height: 28px;
            background: #f0d9b5;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer
        }

        .stone.black {
            width: 22px;
            height: 22px;
            background: #111;
            border-radius: 50%
        }

        .stone.white {
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.2)
        }
    </style>
</head>

<body class="p-3" style="background:#f8f9fa">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>五子棋（同屏對弈）</h3>
            <div>
                <a href="/games" class="btn btn-sm btn-outline-secondary">回遊戲清單</a>
            </div>
        </div>

        <div class="mb-2">目前輪到：<strong id="turn">黑</strong></div>
        <div id="board" class="board"></div>
        <div class="mt-3">
            <button id="reset" class="btn btn-sm btn-warning">重新開始</button>
            <button id="undo" class="btn btn-sm btn-secondary">悔棋</button>
        </div>
    </div>

    <script>
        const SIZE = 15;
        const boardEl = document.getElementById('board');
        const turnEl = document.getElementById('turn');
        let board = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
        let current = 'black';
        let history = [];

        function makeCell(r, c) {
            const el = document.createElement('div');
            el.className = 'cell';
            el.addEventListener('click', () => {
                if (board[r][c]) return;
                placeStone(r, c, current);
            });
            return el;
        }

        function render() {
            boardEl.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = makeCell(r, c);
                    if (board[r][c]) {
                        const s = document.createElement('div');
                        s.className = 'stone ' + board[r][c];
                        cell.appendChild(s);
                    }
                    boardEl.appendChild(cell);
                }
            }
            turnEl.textContent = current === 'black' ? '黑' : '白';
        }

        function placeStone(r, c, color) {
            board[r][c] = color;
            history.push({ r, c, color });
            if (checkWin(r, c, color)) {
                alert((color === 'black' ? '黑' : '白') + '方獲勝！');
                // stop further moves
                current = null;
            } else {
                current = (color === 'black') ? 'white' : 'black';
            }
            render();
        }

        function undo() {
            if (history.length === 0) return;
            const last = history.pop();
            board[last.r][last.c] = null;
            current = last.color;
            render();
        }

        function reset() {
            board = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
            current = 'black';
            history = [];
            render();
        }

        function checkDirection(r, c, dr, dc, color) {
            let cnt = 1;
            for (let k = 1; k < 5; k++) {
                const rr = r + dr * k, cc = c + dc * k;
                if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) break;
                if (board[rr][cc] === color) cnt++; else break;
            }
            for (let k = 1; k < 5; k++) {
                const rr = r - dr * k, cc = c - dc * k;
                if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) break;
                if (board[rr][cc] === color) cnt++; else break;
            }
            return cnt >= 5;
        }

        function checkWin(r, c, color) {
            return checkDirection(r, c, 1, 0, color) || checkDirection(r, c, 0, 1, color) || checkDirection(r, c, 1, 1, color) || checkDirection(r, c, 1, -1, color);
        }

        document.getElementById('reset').addEventListener('click', reset);
        document.getElementById('undo').addEventListener('click', undo);

        render();
    </script>
</body>

</html>
